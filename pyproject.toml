[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantforge"
version = "1.0.0"
description = "Open-source quantitative finance on real market data: pricing (with a C++ engine), portfolios, risk, econometrics, a research lab and an academy with certificates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marin J. Ventalon" }]
keywords = ["quant", "finance", "options", "black-scholes", "monte-carlo", "portfolio", "risk", "garch", "backtesting", "education", "c++"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15.3",
    "pandas>=2.2",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
viz = ["plotly>=5.18"]
app = ["streamlit>=1.50", "plotly>=5.18", "yfinance>=0.2.50", "reportlab>=4.0"]
stats = ["statsmodels>=0.14"]
all = ["quantforge[app,stats]"]
dev = ["quantforge[all]", "pytest>=7", "pytest-cov", "ruff", "arch>=6", "hmmlearn>=0.3",
       "scikit-learn>=1.3"]

[project.scripts]
quantforge-app = "quantforge.cli:app"
quantforge-build-native = "quantforge.native:main"

[project.urls]
Documentation = "https://github.com/YOUR_GITHUB_USERNAME/quantforge/tree/main/docs"
Source = "https://github.com/YOUR_GITHUB_USERNAME/quantforge"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/quantforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quantforge"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E501"]
"src/quantforge/app/pages/*" = ["E501"]
"src/quantforge/app/navigation.py" = ["E501"]
"src/quantforge/app/code_exercises.py" = ["E501"]  # embedded HTML/JS
"src/quantforge/academy/exercises.py" = ["E501"]   # C++/Python templates
"src/quantforge/risk/stress.py" = ["E501"]
"src/quantforge/data/universe.py" = ["E501"]
"src/quantforge/academy/content/*" = ["E501"]
