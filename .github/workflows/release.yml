name: Release

# Push a tag like v1.0.0 to build the package and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the package installs
        run: pip install dist/*.whl && python -c "import quantforge; print(quantforge.__version__)"
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
